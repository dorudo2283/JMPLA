<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOGIN - 日本シャー芯協会</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Yu Gothic", "Meiryo", sans-serif;
}

body{
    background: linear-gradient(to bottom right, #f7f7f7, #ececec);
    color: #111;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

body::before{
    content: "";
    position: fixed;
    inset: 0;
    background:
    linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: -1;
}

.login-container {
    background: white;
    border: 1px solid rgba(0,0,0,0.08);
    padding: 60px 50px;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.05);
    text-align: center;
    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

.logo-area {
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 8px;
}
.logo-area span { color: #a30000; }

.en-title {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    color: #666;
    letter-spacing: 2px;
    margin-bottom: 40px;
    text-transform: uppercase;
}

.input-group {
    margin-bottom: 20px;
    text-align: left;
}

.input-group label {
    display: block;
    font-size: 11px;
    color: #666;
    margin-bottom: 8px;
    letter-spacing: 1px;
}

.input-group input {
    width: 100%;
    padding: 14px;
    border: 1px solid rgba(0,0,0,0.12);
    background: #fafafa;
    font-size: 16px;
    transition: 0.3s;
}

.input-group input:focus {
    outline: none;
    border-color: #111;
    background: white;
}

.remember-me {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #444;
    margin-bottom: 30px;
    cursor: pointer;
}

.remember-me input {
    cursor: pointer;
}

.login-btn {
    width: 100%;
    padding: 16px;
    background: #111;
    color: white;
    border: none;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 6px;
    cursor: pointer;
    transition: 0.3s;
    font-family: 'Cinzel', serif;
}

.login-btn:hover {
    background: #a30000;
}

.forgot-links {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 15px;
}

.forgot-links a {
    font-size: 12px;
    color: #777;
    text-decoration: none;
    transition: 0.3s;
    border-bottom: 1px solid transparent;
}

.forgot-links a:hover {
    color: #111;
    border-bottom-color: #111;
}

.back-home {
    display: inline-block;
    margin-top: 40px;
    font-size: 13px;
    color: #333;
    text-decoration: none;
    transition: 0.3s;
}
.back-home:hover { color: #a30000; }
</style>
</head>
<body>

<div class="login-container">
    <div class="logo-area">日本<span>シャー芯</span>協会</div>
    <div class="en-title">Japan Mechanical Pencil Lead Association</div>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="input-group">
            <label for="userId">ユーザーID</label>
            <input type="text" id="userId" required placeholder="123-456" maxlength="7">
        </div>

        <div class="input-group">
            <label for="password">パスワード</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>

        <label class="remember-me">
            <input type="checkbox" checked> ログイン状態を維持する
        </label>

        <button type="submit" class="login-btn">ログイン</button>
    </form>

    <div class="forgot-links">
        <a href="javascript:void(0);" onclick="forgotId()">IDを忘れた場合</a>
        <span style="color:#ccc;">|</span>
        <a href="javascript:void(0);" onclick="forgotPassword()">パスワードを忘れた場合</a>
    </div>

    <a href="index.html" class="back-home">← 協会に戻る</a>
</div>

<script>

window.onload = function() {
    const idInput = document.getElementById('userId');

    idInput.addEventListener('input', function(e) {
        
        let value = e.target.value.replace(/\D/g, '');
        
        
        if (value.length > 3) {
            value = value.slice(0, 3) + '-' + value.slice(3, 6);
        }
        
        
        e.target.value = value;
    });
};

// 2. ログインボタンが押された時の判定処理
function handleLogin(event) {
    event.preventDefault(); // ページリロードの防止

    const id = document.getElementById('userId').value;
    const pass = document.getElementById('password').value;

    // 厳格な組み合わせチェック
    if (id === "111-111" && pass === "kami2026") {
        alert("ログインしました - ルンド");
        window.location.href = "LoginPage.html"; 
    }
    else if (id === "222-222" && pass === "shasin0.5") {
        alert("ログインしました - サイトウ");
        window.location.href = "LoginPage.html"; 
    }
    else if (id === "333-333" && pass === "wata999") {
        alert("ログインしました - アキヒロ");
        window.location.href = "LoginPage.html"; 
    }
    else {
        alert("【ログイン失敗】\nIDまたはパスワードが一致しません。");
    }
}


function forgotId() {
    alert("【IDを忘れた】\n会員証に記載してあります。紛失時は管理者のサイトウにお問い合わせください。");
}

function forgotPassword() {
    alert("【パスワードを忘れた】\nログイン申請済みの方はパスワードを記載した紙、pdfがあるはずです。確認してください。\nない場合、わからない場合はサイトウまでお問い合わせください。");
}
</script>

</body>
</html>
