<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会員専用拠点 - 日本シャー芯協会</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Yu Gothic", "Meiryo", sans-serif;
}

body{
    background: linear-gradient(to bottom right, #f7f7f7, #ececec);
    color: #111;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

body::before{
    content: "";
    position: fixed;
    inset: 0;
    background:
    linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: -1;
}

/* プロフィール切替用の選択メニュー */
.switcher-box {
    margin-bottom: 20px;
    width: 100%;
    max-width: 500px;
    text-align: left;
}

.switcher-box label {
    font-size: 11px;
    color: #666;
    letter-spacing: 1px;
    display: block;
    margin-bottom: 5px;
}

.switcher-select {
    width: 100%;
    padding: 10px 15px;
    border: 1px solid rgba(0,0,0,0.12);
    background: white;
    font-size: 14px;
    color: #111;
    cursor: pointer;
    outline: none;
    transition: 0.3s;
}

.switcher-select:focus {
    border-color: #111;
}

.profile-container {
    background: white;
    border: 1px solid rgba(0,0,0,0.08);
    padding: 60px 50px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.05);
    text-align: center;
    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

.logo-area {
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 40px;
}
.logo-area span { color: #a30000; }

.avatar {
    width: auto;
    min-width: 90px;
    height: auto;
    min-height: 90px;
    background: #111;
    color: white;
    font-size: 16px;
    padding: 15px;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 25px;
    border-radius: 50px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    line-height: 1.4;
}

.user-name {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 10px;
    letter-spacing: 1px;
}

.rank-badge {
    display: inline-block;
    padding: 6px 22px;
    background: #111;
    color: white;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 35px;
}

.description-box {
    text-align: left;
    border-top: 1px solid #eee;
    padding-top: 25px;
    font-size: 14px;
    line-height: 1.8;
    color: #444;
    background: #fafafa;
    padding: 20px;
    border-radius: 4px;
    border: 1px solid rgba(0,0,0,0.02);
}

.description-title {
    font-weight: bold;
    color: #111;
    margin-bottom: 8px;
    font-size: 12px;
    letter-spacing: 1px;
}

.logout-btn {
    display: inline-block;
    margin-top: 40px;
    color: #777;
    text-decoration: none;
    font-size: 13px;
    transition: 0.3s;
    border-bottom: 1px solid transparent;
}
.logout-btn:hover {
    color: #a30000;
    border-bottom-color: #a30000;
}
</style>
</head>
<body>

<div class="switcher-box">
    <label for="memberSwitcher">閲覧プロフィール切り替え（ID非表示）</label>
    <select id="memberSwitcher" class="switcher-select" onchange="switchProfile(this.value)">
        <option value="current">自分がログインしたアカウント</option>
        <option value="000-000">ルンド（教祖）</option>
        <option value="246-602">サイトウ（主）</option>
        <option value="148-525">アキヒロ（運営）</option>
    </select>
</div>

<div class="profile-container">
    <div class="logo-area">日本<span>シャー芯</span>協会 - アカウントページ</div>

    <div class="avatar" id="userAvatar">-</div>
    <div class="user-name" id="userName">ロード中です....</div>
    <div>
        <div class="rank-badge" id="userRank">一般会員</div>
    </div>
    
    <div class="description-box">
        <div class="description-title">【 所属説明・任務 】</div>
        <p id="userDesc">説明文を読み込み中です...</p>
    </div>

    <a href="index.html" class="logout-btn">ログアウト</a>
</div>

<script>
const usersDatabase = {
    "000-000": {
        name: "ルンド",
        rank: "教祖",
        initial: "未設定",
        desc: "初代芯覚醒者。「芯は人生である」と最初に語った人物であり、当協会の精神的支柱。HBも2Bもすべて平等に愛する。"
    },
    "246-602": {
        name: "サイトウ",
        rank: "主（管理者）",
        initial: "やっぱコード書くの楽しい！",
        desc: "協会創設者であり、このWEBシステムの最高管理者。数学は44点だが、シャー芯の管理能力と熱意は他の追随を許さない。"
    },
    "148-525": {
        name: "アキヒロ",
        rank: "運営（ワタナベ）",
        initial: "未設定",
        desc: "加入審査および協会の実務・運営を担当する要員。なぜか裏の権限が非常に強く、非常に頭が冴える切れ者。"
    }
};

// ログインした本人のIDを保持する変数
let loggedInId = "";

window.onload = function() {
    // サイトウ様の新規ID「246-602」にデフォルト値を合わせてエラーを修正
    loggedInId = localStorage.getItem('last_login_id') || "246-602"; 
    
    // 初期表示を実行
    renderProfile(loggedInId);
};

// プロフィール情報を画面にレンダリングする関数
function renderProfile(id) {
    let currentUser = {
        name: "一般会員",
        rank: "MEMBER",
        initial: "M",
        desc: "協会の一般会員です。"
    };

    if (usersDatabase[id]) {
        currentUser = usersDatabase[id];
    }

    document.getElementById('userName').innerText = currentUser.name;
    document.getElementById('userRank').innerText = currentUser.rank;
    document.getElementById('userAvatar').innerText = currentUser.initial;
    document.getElementById('userDesc').innerText = currentUser.desc;
}

// ドロップダウンが変更された時の処理
function switchProfile(selectedValue) {
    if (selectedValue === "current") {
        renderProfile(loggedInId); // ログインした本人に戻す
    } else {
        renderProfile(selectedValue); // 選択された他のメンバーの情報を表示
    }
}
</script>

</body>
</html>
