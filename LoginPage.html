<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会員専用拠点 - 日本シャー芯協会</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Yu Gothic", "Meiryo", sans-serif;
}

body{
    background: linear-gradient(to bottom right, #f7f7f7, #ececec);
    color: #111;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

body::before{
    content: "";
    position: fixed;
    inset: 0;
    background:
    linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: -1;
}

.profile-container {
    background: white;
    border: 1px solid rgba(0,0,0,0.08);
    padding: 60px 50px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.05);
    text-align: center;
    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

.logo-area {
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 40px;
}
.logo-area span { color: #a30000; }

.avatar {
    width: 90px;
    height: 90px;
    background: #111;
    color: white;
    font-family: 'Cinzel', serif;
    font-size: 32px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 25px;
    border-radius: 50%;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

.user-name {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 10px;
    letter-spacing: 1px;
}

.rank-badge {
    display: inline-block;
    padding: 6px 22px;
    background: #111;
    color: white;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 35px;
}

.description-box {
    text-align: left;
    border-top: 1px solid #eee;
    padding-top: 25px;
    font-size: 14px;
    line-height: 1.8;
    color: #444;
    background: #fafafa;
    padding: 20px;
    border-radius: 4px;
    border: 1px solid rgba(0,0,0,0.02);
}

.description-title {
    font-weight: bold;
    color: #111;
    margin-bottom: 8px;
    font-size: 12px;
    letter-spacing: 1px;
}

.logout-btn {
    display: inline-block;
    margin-top: 40px;
    color: #777;
    text-decoration: none;
    font-size: 13px;
    transition: 0.3s;
    border-bottom: 1px solid transparent;
}
.logout-btn:hover {
    color: #a30000;
    border-bottom-color: #a30000;
}
</style>
</head>
<body>

<div class="profile-container">
    <div class="logo-area">日本<span>シャー芯</span>協会 - アカウントページ</div>

    <div class="avatar" id="userAvatar">-</div>
    <div class="user-name" id="userName">ロード中です....</div>
    <div>
        <div class="rank-badge" id="userRank">一般会員</div>
    </div>
    
    <div class="description-box">
        <div class="description-title">【 所属説明・任務 】</div>
        <p id="userDesc">説明文を読み込み中です...</p>
    </div>

    <a href="index.html" class="logout-btn">ログアウト</a>
</div>

<script>
// 全員分のデータ（IDは判別のみに使用し、画面上には一切出力しません）
const usersDatabase = {
    "000-000": {
        name: "ルンド",
        rank: "教祖",
        initial: "未設定",
        desc: "初代芯覚醒者。「芯は人生である」と最初に語った人物であり、当協会の精神的支柱。HBも2Bもすべて平等に愛する。"
    },
    "246-602": {
        name: "サイトウ",
        rank: "主（管理者）",
        initial: "やっぱコード書くの楽しい！",
        desc: "協会創設者であり、このWEBシステムの最高管理者。数学は44点だが、シャー芯の管理能力と熱意は他の追随を許さない。"
    },
    "148-525": {
        name: "アキヒロ",
        rank: "運営（ワタナベ）",
        initial: "未設定",
        desc: "加入審査および協会の実務・運営を担当する要員。なぜか裏の権限が非常に強く、非常に頭が冴える切れ者。"
    }
};

window.onload = function() {
    // 直前にログインしたIDをブラウザの記憶から取得（デフォルトはサイトウ様）
    const lastLoginId = localStorage.getItem('last_login_id') || "222-222"; 
    
    let currentUser = {
        name: "一般会員",
        rank: "MEMBER",
        initial: "M",
        desc: "協会の一般会員です。"
    };

    // 一致するIDのデータをセット
    if (usersDatabase[lastLoginId]) {
        currentUser = usersDatabase[lastLoginId];
    }

    // 各要素に安全に反映
    document.getElementById('userName').innerText = currentUser.name;
    document.getElementById('userRank').innerText = currentUser.rank;
    document.getElementById('userAvatar').innerText = currentUser.initial;
    document.getElementById('userDesc').innerText = currentUser.desc;
};
</script>

</body>
</html>
